<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>PixoraAI Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#080b16;
  color:#f7f8ff;
  min-height:100vh;
  padding:18px;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.container{
  width:100%;
  max-width:1150px;
  margin:auto;
}

/* ================= HEADER ================= */

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:15px;
  background:linear-gradient(135deg,#7c5cff,#20d9a1);
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:20px;
  box-shadow:0 8px 30px #0005;
}

.brand h1{
  font-size:19px;
}

.brand small{
  display:block;
  color:#8994b0;
  font-size:11px;
  margin-top:3px;
}

.header-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.refresh,
.logout{
  padding:11px 15px;
  border-radius:12px;
  color:white;
}

.refresh{
  background:#151c30;
}

.refresh:hover{
  background:#202a45;
}

.logout{
  background:#9b3043;
}

.logout:hover{
  background:#b63b51;
}

/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat{
  background:linear-gradient(180deg,#161d34,#101629);
  border:1px solid #ffffff0d;
  border-radius:18px;
  padding:17px;
}

.stat-icon{
  font-size:22px;
}

.stat b{
  display:block;
  font-size:24px;
  margin-top:7px;
}

.stat small{
  color:#8994b0;
}

/* ================= TABS ================= */

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:12px;
  overflow:auto;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  padding:11px 16px;
  border-radius:12px;
  background:#151c30;
  color:#aab4cc;
  white-space:nowrap;
}

.tab:hover{
  background:#202a45;
}

.tab.active{
  background:#7c5cff;
  color:white;
}

/* ================= PANELS ================= */

.panel{
  display:none;
  background:#11172a;
  border:1px solid #ffffff0b;
  border-radius:20px;
  padding:15px;
}

.panel.active{
  display:block;
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.panel-head h2{
  font-size:17px;
}

.search{
  width:220px;
  max-width:48%;
  padding:10px 12px;
  border-radius:11px;
  background:#090e1d;
  color:white;
  border:1px solid #ffffff10;
  outline:none;
}

.search:focus{
  border-color:#7c5cff;
}

/* ================= TABLE ================= */

.table-wrap{
  width:100%;
  overflow:auto;
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:760px;
}

th,
td{
  padding:12px 9px;
  text-align:left;
  border-bottom:1px solid #ffffff0a;
  font-size:12px;
  vertical-align:middle;
}

th{
  color:#8994b0;
  font-size:10px;
  text-transform:uppercase;
}

td small{
  display:block;
  color:#8d98b2;
  margin-top:3px;
}

.badge{
  display:inline-block;
  padding:6px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:700;
  text-transform:capitalize;
}

.pending{
  background:#f5a6231a;
  color:#f5b74f;
}

.approved,
.completed{
  background:#20d9a11a;
  color:#20d9a1;
}

.rejected,
.cancelled{
  background:#ff4d671a;
  color:#ff7184;
}

.processing{
  background:#7c5cff1a;
  color:#a999ff;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.btn{
  padding:7px 10px;
  border-radius:9px;
  color:white;
  font-size:10px;
  font-weight:700;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.approve{
  background:#168c6b;
}

.approve:hover{
  background:#1ca77f;
}

.reject{
  background:#9b3043;
}

.reject:hover{
  background:#b63b51;
}

.view{
  background:#353e5c;
}

.view:hover{
  background:#465171;
}

.loading,
.empty{
  padding:30px;
  text-align:center;
  color:#8994b0;
}

/* ================= LOGIN ================= */

.login-box{
  position:fixed;
  inset:0;
  background:#080b16;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.login-card{
  width:min(420px,100%);
  background:#11172a;
  border:1px solid #ffffff0d;
  border-radius:22px;
  padding:25px;
  box-shadow:0 25px 70px #0008;
}

.login-logo{
  width:58px;
  height:58px;
  border-radius:18px;
  background:linear-gradient(135deg,#7c5cff,#20d9a1);
  display:grid;
  place-items:center;
  font-size:24px;
  font-weight:900;
  margin-bottom:15px;
}

.login-card h2{
  margin-bottom:8px;
}

.login-card p{
  color:#8994b0;
  font-size:12px;
  margin-bottom:18px;
  line-height:1.6;
}

.login-card input{
  width:100%;
  padding:13px;
  margin-bottom:10px;
  border-radius:11px;
  border:1px solid #ffffff12;
  background:#090e1d;
  color:white;
  outline:none;
}

.login-card input:focus{
  border-color:#7c5cff;
}

.login-btn{
  width:100%;
  padding:13px;
  border-radius:11px;
  background:#7c5cff;
  color:white;
  font-weight:800;
}

.login-btn:hover{
  background:#8d72ff;
}

.login-btn:disabled{
  opacity:.6;
}

.error{
  color:#ff7184;
  font-size:12px;
  margin-top:10px;
  display:none;
  line-height:1.5;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:200;
}

.modal.show{
  display:flex;
}

.sheet{
  width:min(700px,100%);
  margin:auto 0 0;
  background:#10162a;
  border-radius:25px 25px 0 0;
  padding:22px;
  max-height:85vh;
  overflow:auto;
  box-shadow:0 -15px 60px #0008;
}

.sheet h3{
  font-size:19px;
  margin-bottom:12px;
}

.detail{
  background:#090e1d;
  padding:13px;
  border-radius:13px;
  margin-bottom:9px;
  overflow-wrap:anywhere;
}

.detail small{
  display:block;
  color:#7f8aa6;
  margin-bottom:4px;
}

.detail b{
  font-size:13px;
}

.close{
  width:100%;
  padding:12px;
  border-radius:12px;
  background:#20283d;
  color:white;
  margin-top:5px;
}

.close:hover{
  background:#2b3653;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  color:#101323;
  padding:11px 16px;
  border-radius:12px;
  font-size:12px;
  font-weight:800;
  display:none;
  z-index:500;
  max-width:90%;
  text-align:center;
}

.toast.show{
  display:block;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  body{
    padding:12px;
  }

  header{
    align-items:flex-start;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .panel-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .search{
    width:100%;
    max-width:100%;
  }

  .header-actions{
    justify-content:flex-end;
  }
}

@media(max-width:430px){

  header{
    flex-direction:column;
  }

  .header-actions{
    width:100%;
  }

  .refresh,
  .logout{
    flex:1;
  }

  .stat{
    padding:13px;
  }

  .stat b{
    font-size:20px;
  }

  .brand h1{
    font-size:17px;
  }
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<!-- ================= ADMIN LOGIN ================= -->

<div class="login-box" id="loginBox">

  <div class="login-card">

    <div class="login-logo">A</div>

    <h2>PixoraAI Admin</h2>

    <p>
      শুধু অনুমোদিত Admin account দিয়ে Login করুন।
    </p>

    <input
      id="loginEmail"
      type="email"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      class="login-btn"
      id="loginButton"
      onclick="adminLogin()"
    >
      Login
    </button>

    <div
      class="error"
      id="loginError"
    ></div>

  </div>
</div>


<!-- ================= ADMIN APP ================= -->

<div
  class="container"
  id="adminApp"
>

  <!-- HEADER -->

  <header>

    <div class="brand">

      <div class="logo">A</div>

      <div>

        <h1>PixoraAI Admin</h1>

        <small>
          Atik Branding • Control Panel
        </small>

      </div>

    </div>

    <div class="header-actions">

      <button
        class="refresh"
        onclick="loadAll()"
      >
        🔄 Refresh
      </button>

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </header>


  <!-- STATS -->

  <section class="stats">

    <div class="stat">

      <div class="stat-icon">👤</div>

      <b id="usersCount">0</b>

      <small>Total Users</small>

    </div>

    <div class="stat">

      <div class="stat-icon">💰</div>

      <b id="depositCount">0</b>

      <small>Deposits</small>

    </div>

    <div class="stat">

      <div class="stat-icon">💸</div>

      <b id="withdrawCount">0</b>

      <small>Withdrawals</small>

    </div>

    <div class="stat">

      <div class="stat-icon">📦</div>

      <b id="ordersCount">0</b>

      <small>Orders</small>

    </div>

  </section>


  <!-- TABS -->

  <div class="tabs">

    <button
      class="tab active"
      onclick="showTab('transactions',this)"
    >
      💰 Transactions
    </button>

    <button
      class="tab"
      onclick="showTab('orders',this)"
    >
      📦 Orders
    </button>

  </div>


  <!-- TRANSACTIONS -->

  <section
    id="transactions"
    class="panel active"
  >

    <div class="panel-head">

      <h2>Deposit / Withdrawal</h2>

      <input
        id="transactionSearch"
        class="search"
        placeholder="Search..."
        oninput="renderTransactions()"
      >

    </div>

    <div id="transactionContent">

      <div class="loading">
        Loading...
      </div>

    </div>

  </section>


  <!-- ORDERS -->

  <section
    id="orders"
    class="panel"
  >

    <div class="panel-head">

      <h2>Photo / Video Orders</h2>

      <input
        id="orderSearch"
        class="search"
        placeholder="Search..."
        oninput="renderOrders()"
      >

    </div>

    <div id="orderContent">

      <div class="loading">
        Loading...
      </div>

    </div>

  </section>

</div>


<!-- ================= DETAILS MODAL ================= -->

<div
  class="modal"
  id="detailModal"
>

  <div class="sheet">

    <h3 id="detailTitle">
      Details
    </h3>

    <div id="detailBody"></div>

    <button
      class="close"
      onclick="closeDetails()"
    >
      Close
    </button>

  </div>

</div>


<!-- ================= TOAST ================= -->

<div
  class="toast"
  id="toast"
>
  Done
</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "https://yijviyxdcrhkjqx.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_wlq00hXvpHtoa5rmG-A7PA_OXgY4VMd";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   GLOBAL DATA
===================================================== */

let transactions = [];
let orders = [];
let users = [];

let currentUser = null;


/* =====================================================
   START
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    await checkSession();

  }
);


/* =====================================================
   AUTH CHECK
===================================================== */

async function checkSession(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();

    if(error){

      console.error(error);

      showLogin();

      return;

    }

    if(!data.session){

      showLogin();

      return;

    }

    currentUser =
      data.session.user;

    const allowed =
      await verifyAdmin();

    if(!allowed){

      await supabaseClient.auth.signOut();

      currentUser = null;

      showLogin();

      showLoginError(
        "এই account-এর Admin permission নেই।"
      );

      return;

    }

    hideLogin();

    await loadAll();

  }catch(error){

    console.error(error);

    showLogin();

    showLoginError(
      error.message ||
      "Session check failed."
    );

  }

}


/* =====================================================
   VERIFY ADMIN
===================================================== */

async function verifyAdmin(){

  if(!currentUser){
    return false;
  }

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,email,full_name,role"
        )
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();

    if(error){

      console.error(
        "Admin verification:",
        error
      );

      return false;

    }

    if(!data){
      return false;
    }

    return (
      String(
        data.role || ""
      ).toLowerCase() === "admin"
    );

  }catch(error){

    console.error(error);

    return false;

  }

}


/* =====================================================
   LOGIN
===================================================== */

async function adminLogin(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  if(!email || !password){

    showLoginError(
      "Email এবং Password দিন।"
    );

    return;

  }

  const button =
    document
      .getElementById("loginButton");

  button.disabled = true;

  button.textContent =
    "Logging in...";

  hideLoginError();

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({

        email: email,
        password: password

      });

    if(error){
      throw error;
    }

    currentUser =
      data.user;

    const allowed =
      await verifyAdmin();

    if(!allowed){

      await supabaseClient.auth.signOut();

      currentUser = null;

      throw new Error(
        "এই account Admin account নয়।"
      );

    }

    hideLogin();

    await loadAll();

  }catch(error){

    console.error(error);

    showLoginError(
      error.message ||
      "Login failed."
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "Login";

  }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  try{

    await supabaseClient.auth.signOut();

  }catch(error){

    console.error(error);

  }

  currentUser = null;

  transactions = [];
  orders = [];
  users = [];

  showLogin();

}


/* =====================================================
   LOGIN UI
===================================================== */

function showLogin(){

  document
    .getElementById("loginBox")
    .style.display = "flex";

  document
    .getElementById("adminApp")
    .style.display = "none";

}


function hideLogin(){

  document
    .getElementById("loginBox")
    .style.display = "none";

  document
    .getElementById("adminApp")
    .style.display = "block";

}


function showLoginError(message){

  const el =
    document
      .getElementById("loginError");

  el.textContent =
    message || "Error";

  el.style.display =
    "block";

}


function hideLoginError(){

  const el =
    document
      .getElementById("loginError");

  el.textContent = "";

  el.style.display =
    "none";

}


/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function loadAll(){

  if(!currentUser){

    showLogin();

    return;

  }

  try{

    await loadUsers();

    await Promise.all([
      loadTransactions(),
      loadOrders()
    ]);

    showToast(
      "Data refreshed ✅"
    );

  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "Loading error"
    );

  }

}


/* =====================================================
   USERS
===================================================== */

async function loadUsers(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("users")
        .select(
          "id,name,email,balance,phone,created_at"
        );

    if(!error){

      users =
        data || [];

    }else{

      const fallback =
        await supabaseClient
          .from("profiles")
          .select(
            "id,email,full_name,phone,created_at"
          );

      if(!fallback.error){

        users =
          (fallback.data || [])
            .map(function(u){

              return {

                id: u.id,

                name:
                  u.full_name ||
                  u.email ||
                  "Unknown",

                email:
                  u.email ||
                  "",

                balance: 0,

                phone:
                  u.phone ||
                  "",

                created_at:
                  u.created_at

              };

            });

      }else{

        users = [];

      }

    }

  }catch(error){

    console.error(
      "Users loading:",
      error
    );

    users = [];

  }

  document
    .getElementById("usersCount")
    .textContent =
    users.length;

}


/* =====================================================
   TRANSACTIONS
===================================================== */

async function loadTransactions(){

  const box =
    document
      .getElementById(
        "transactionContent"
      );

  box.innerHTML =
    '<div class="loading">Loading...</div>';

  const [
    depositsResult,
    withdrawalsResult
  ] =
    await Promise.all([

      supabaseClient
        .from("deposits")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        ),

      supabaseClient
        .from("withdrawals")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        )

    ]);

  if(depositsResult.error){
    throw depositsResult.error;
  }

  if(withdrawalsResult.error){
    throw withdrawalsResult.error;
  }

  const deposits =
    depositsResult.data || [];

  const withdrawals =
    withdrawalsResult.data || [];

  transactions = [

    ...deposits.map(function(d){

      return {

        ...d,

        type:"deposit",

        payment_method:
          d.method,

        name:
          getUserName(
            d.user_id
          ),

        phone:
          getUserPhone(
            d.user_id
          )

      };

    }),

    ...withdrawals.map(function(w){

      return {

        ...w,

        type:"withdraw",

        payment_method:
          w.method,

        name:
          getUserName(
            w.user_id
          ),

        phone:
          getUserPhone(
            w.user_id
          )

      };

    })

  ];

  transactions.sort(
    function(a,b){

      return (
        new Date(
          b.created_at || 0
        ) -
        new Date(
          a.created_at || 0
        )
      );

    }
  );

  document
    .getElementById(
      "depositCount"
    )
    .textContent =
    deposits.length;

  document
    .getElementById(
      "withdrawCount"
    )
    .textContent =
    withdrawals.length;

  renderTransactions();

}


/* =====================================================
   USER HELPERS
===================================================== */

function getUser(userId){

  return users.find(
    function(u){

      return String(u.id) ===
        String(userId);

    }
  );

}


function getUserName(userId){

  const user =
    getUser(userId);

  return (
    user?.name ||
    user?.full_name ||
    user?.email ||
    "Unknown"
  );

}


function getUserPhone(userId){

  const user =
    getUser(userId);

  return (
    user?.phone ||
    ""
  );

}


/* =====================================================
   RENDER TRANSACTIONS
===================================================== */

function renderTransactions(){

  const box =
    document
      .getElementById(
        "transactionContent"
      );

  const search =
    document
      .getElementById(
        "transactionSearch"
      )
      .value
      .toLowerCase()
      .trim();

  const list =
    transactions.filter(
      function(t){

        const text = [

          t.id,
          t.name,
          t.phone,
          t.type,
          t.status,
          t.transaction_id,
          t.method,
          t.payment_method

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        return text.includes(search);

      }
    );

  if(!list.length){

    box.innerHTML =
      '<div class="empty">No transactions found.</div>';

    return;

  }

/* =====================================================
   ORDERS
===================================================== */

async function loadOrders(){

  const box =
    document
      .getElementById(
        "orderContent"
      );

  box.innerHTML =
    '<div class="loading">Loading...</div>';

  const {
    data,
    error
  } =
    await supabaseClient
      .from("orders")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(error){
    throw error;
  }

  orders =
    data || [];

  document
    .getElementById(
      "ordersCount"
    )
    .textContent =
    orders.length;

  renderOrders();

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(){

  const box =
    document
      .getElementById(
        "orderContent"
      );

  const search =
    document
      .getElementById(
        "orderSearch"
      )
      .value
      .toLowerCase()
      .trim();

  const list =
    orders.filter(
      function(o){

        const text = [

          o.id,
          o.user_id,
          o.order_type,
          o.status,
          o.transaction_id,
          getUserName(o.user_id),
          getUserPhone(o.user_id)

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        return text.includes(search);

      }
    );

  if(!list.length){

    box.innerHTML =
      '<div class="empty">No orders found.</div>';

    return;

  }

  let html = `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>ID</th>
            <th>User</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Action</th>
          </tr>

        </thead>

        <tbody>

  `;

  list.forEach(function(o){

    let actions = `

      <button
        class="btn view"
        onclick="showOrder(
          '${escAttr(o.id)}'
        )"
      >
        View
      </button>

    `;

    const status =
      String(
        o.status || "pending"
      ).toLowerCase();

    if(status === "pending"){

      actions += `

        <button
          class="btn approve"
          onclick="updateOrderStatus(
            '${escAttr(o.id)}',
            'processing'
          )"
        >
          Process
        </button>

        <button
          class="btn reject"
          onclick="updateOrderStatus(
            '${escAttr(o.id)}',
            'cancelled'
          )"
        >
          Cancel
        </button>

      `;

    }

    if(status === "processing"){

      actions += `

        <button
          class="btn approve"
          onclick="updateOrderStatus(
            '${escAttr(o.id)}',
            'completed'
          )"
        >
          Complete
        </button>

      `;

    }

    html += `

      <tr>

        <td>
          #${esc(o.id)}
        </td>

        <td>

          <b>
            ${esc(
              getUserName(
                o.user_id
              )
            )}
          </b>

          <small>
            ${esc(
              getUserPhone(
                o.user_id
              )
            )}
          </small>

        </td>

        <td>
          ${esc(
            o.order_type ||
            "-"
          )}
        </td>

        <td>

          <b>
            ৳${Number(
              o.amount || 0
            ).toLocaleString()}
          </b>

        </td>

        <td>

          <span
            class="badge ${statusClass(status)}"
          >
            ${esc(status)}
          </span>

        </td>

        <td>

          <div class="actions">
            ${actions}
          </div>

        </td>

      </tr>

    `;

  });

  html += `

      </table>

    </div>

  box.innerHTML =
    html;

}

/* =====================================================
   TABS
===================================================== */

function showTab(
  tab,
  button
){

  document
    .querySelectorAll(".panel")
    .forEach(
      function(p){

        p.classList.remove(
          "active"
        );

      }
    );

  document
    .querySelectorAll(".tab")
    .forEach(
      function(t){

        t.classList.remove(
          "active"
        );

      }
    );

  const panel =
    document.getElementById(
      tab
    );

  if(panel){

    panel.classList.add(
      "active"
    );

  }

  if(button){

    button.classList.add(
      "active"
    );

  }

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;

function showToast(message){

  const toast =
    document
      .getElementById(
        "toast"
      );

  toast.textContent =
    message || "Done";

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      function(){

        toast.classList.remove(
          "show"
        );

      },
      2500
    );

}


/* =====================================================
   STATUS CLASS
===================================================== */

function statusClass(status){

  const value =
    String(
      status || "pending"
    )
    .toLowerCase()
    .replace(
      /[^a-z]/g,
      ""
    );

  const allowed = [

    "pending",
    "approved",
    "rejected",
    "processing",
    "completed",
    "cancelled"

  ];

  return allowed.includes(value)
    ? value
    : "pending";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escAttr(value){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}


/* =====================================================
   DATE
===================================================== */

function formatDate(date){

  if(!date){
    return "-";
  }

  try{

    return new Date(
      date
    ).toLocaleString(
      "en-BD",
      {
        dateStyle:"medium",
        timeStyle:"short"
      }
    );

  }catch(error){

    return String(date);

  }

}
