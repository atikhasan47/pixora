function getSupabaseAuth(){
  return supabaseClient?.auth || null;
}
function setAuthMsg(msg,ok=false){const el=$('authMsg');if(el){el.textContent=msg;el.style.color=ok?'#20d9a1':'#ff9cad'}}
function openApp(){ $('authGate').style.display='none'; $('pixoraApp').style.display='block'; }
function showAuth(){ $('authGate').style.display='grid'; $('pixoraApp').style.display='none'; }

async function ensureUserRow(user){
  if(!supabaseClient||!user)return null;
  const {data:existing,error:findError}=await supabaseClient
    .from('users').select('id,auth_id').eq('auth_id',user.id).maybeSingle();
  if(findError) throw findError;
  if(existing) return existing;
  const name=$('authName')?.value.trim()||user.user_metadata?.name||user.email?.split('@')[0]||'User';
  const phone=$('authPhone')?.value.trim()||user.user_metadata?.phone||'';
  const {data,error}=await supabaseClient.from('users').insert({
    auth_id:user.id,name,email:user.email,phone,balance:0
  }).select('id,auth_id').single();
  if(error){
    if(String(error.message||'').toLowerCase().includes('duplicate')){
      const {data:again}=await supabaseClient.from('users').select('id,auth_id').eq('auth_id',user.id).maybeSingle();
      return again||null;
    }
    throw error;
  }
  return data;
}

async function pixoraLogin(){
  if(!supabaseClient?.auth){setAuthMsg('Supabase Auth connection তৈরি হয়নি। পেজটি Refresh করুন।');return;}
  const email=$('authEmail')?.value.trim(),password=$('authPassword')?.value||'';
  if(!email||!password){setAuthMsg('Email ও Password দিন।');return}
  try{const {data,error}=await getSupabaseAuth().signInWithPassword({email,password});if(error)throw error;await ensureUserRow(data.user);await syncUserData();openApp();setAuthMsg('Login সফল হয়েছে।',true);}catch(e){setAuthMsg(e.message||'Login failed');}
}
async function pixoraSignup(){
  if(!supabaseClient?.auth){setAuthMsg('Supabase Auth connection তৈরি হয়নি। পেজটি Refresh করুন।');return;}
  const email=$('authEmail')?.value.trim(),password=$('authPassword')?.value||'',name=$('authName')?.value.trim(),phone=$('authPhone')?.value.trim();
  if(!email||!password){setAuthMsg('Email ও Password দিন।');return}
  if(password.length<6){setAuthMsg('Password কমপক্ষে 6 অক্ষরের দিন।');return}
  try{const {data,error}=await getSupabaseAuth().signUp({email,password,options:{data:{name:name||'',phone:phone||''}}});if(error)throw error;if(data.session){await ensureUserRow(data.user);await syncUserData();openApp();setAuthMsg('Signup সফল হয়েছে।',true);}else setAuthMsg('Signup হয়েছে। Email confirmation লাগতে পারে।');}catch(e){setAuthMsg(e.message||'Signup failed');}
}

async function syncUserData(){
  if(!supabaseClient)return;
  const {data:{user}}=await getSupabaseAuth().getUser();if(!user)return;
  state.user=user; const uidEl=$('profileUserId'); if(uidEl)uidEl.value=user.id;
  try{
    const {data:u,error:uError}=await supabaseClient.from('users').select('*').eq('auth_id',user.id).maybeSingle();
    if(uError) throw uError;
    const legacyUserId=u?.id;
    const [tR,oR,dR,wR,mR,sR,nR]=await Promise.all([
      supabaseClient.from('tasks').select('*').eq('status','published').order('created_at',{ascending:false}),
      legacyUserId!=null ? supabaseClient.from('orders').select('*').eq('user_id',legacyUserId).order('created_at',{ascending:false}) : Promise.resolve({data:[],error:null}),
      supabaseClient.from('deposits').select('*').eq('user_id',user.id).order('created_at',{ascending:false}),
      supabaseClient.from('withdrawals').select('*').eq('user_id',user.id).order('created_at',{ascending:false}),
      supabaseClient.from('messages').select('*').or(`user_id.eq.${user.id},sender_id.eq.${user.id}`).order('created_at',{ascending:false}),
      supabaseClient.from('task_submissions').select('*').eq('user_id',user.id).order('submitted_at',{ascending:false}),
      supabaseClient.from('notices').select('*').eq('is_active',true).order('is_pinned',{ascending:false}).order('created_at',{ascending:false})
    ]);
    const uR={data:u};
    if(uR.data){state.balance=Number(uR.data.balance||0);state.profile={...state.profile,name:uR.data.name||state.profile.name||'',phone:uR.data.phone||state.profile.phone||''};}
    if(Array.isArray(tR.data))state.tasks=tR.data.map(t=>({...t,reward:Number(t.reward||0),createdAt:t.created_at}));
    if(Array.isArray(oR.data))state.orders=oR.data.map(o=>({...o,service:o.order_type||o.service||o.type,transactionId:o.transaction_id,date:o.created_at}));
    if(Array.isArray(dR.data))state.deposits=dR.data.map(d=>({...d,transactionId:d.transaction_id,date:d.created_at}));
    if(Array.isArray(wR.data))state.withdrawals=wR.data.map(w=>({...w,number:w.account,date:w.created_at}));
    if(Array.isArray(tR.data)){state.tasks=tR.data.map(t=>({...t,reward:Number(t.reward||0),createdAt:t.created_at}));renderTasks();}
    if(Array.isArray(nR.data))renderUserNotices(nR.data);
    // Keep the displayed wallet balance tied to the same canonical legacy balance
    // used by Admin deposit/withdrawal processing.
    state.walletHistory=[
      ...state.deposits.map(d=>({id:'deposit-'+d.id,type:'deposit',title:`Deposit — ${String(d.status||'pending')}`,amount:Number(d.status||'').toLowerCase()==='approved'?Number(d.amount)||0:0,status:String(d.status||'pending'),date:d.date||d.created_at||''})),
      ...state.withdrawals.map(w=>({id:'withdraw-'+w.id,type:'withdrawal',title:`Withdrawal — ${String(w.status||'pending')}`,amount:Number(w.amount)||0,status:String(w.status||'pending'),date:w.date||w.created_at||''}))
    ].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
    if(Array.isArray(mR.data))state.messages=mR.data;
    if(Array.isArray(sR.data))state.taskSubmissions=sR.data;
    if(Array.isArray(nR.data)) renderUserNotices(nR.data);
    persist();renderTasks();renderOrders();renderIncome();renderUserMessages();
  }catch(e){console.warn('User sync:',e.message||e)}
}

  try{
    const {data,error}=await supabaseClient.from('notices').select('*').eq('is_active',true).order('is_pinned',{ascending:false}).order('created_at',{ascending:false});
    if(error)throw error; renderUserNotices(Array.isArray(data)?data:[]);
  }catch(e){box.innerHTML=`<div class="empty">${escapeHTML(e.message||'Notifications load failed')}</div>`;}

function renderUserNotices(list){
  const box=$('userNotices'); if(!box)return;
  if(!list.length){box.innerHTML='<div class="empty">কোনো নতুন notification নেই।</div>';return;}
  box.innerHTML=list.slice(0,20).map(n=>`<div class="history"><b>${escapeHTML(n.title||'Pixora Notice')}</b><div class="notice">${escapeHTML(n.message||'')}</div><small>${escapeHTML(n.created_at||'')}</small></div>`).join('');
}

async function refreshPixoraBalance(){
  if(!supabaseClient)return;
  try{
    const {data:{user}}=await getSupabaseAuth().getUser();
    if(!user)return;
    const {data,error}=await supabaseClient.from('users').select('balance').eq('auth_id',user.id).maybeSingle();
    if(error)throw error;
    if(data){
      state.balance=Number(data.balance||0);
      persist();
      renderIncome();
    }
    // Always refresh deposit/withdrawal status so Admin approval appears without logout.
    const [dR,wR,tR,nR]=await Promise.all([
      supabaseClient.from('deposits').select('*').eq('user_id',user.id).order('created_at',{ascending:false}),
      supabaseClient.from('withdrawals').select('*').eq('user_id',user.id).order('created_at',{ascending:false}),
      supabaseClient.from('tasks').select('*').eq('status','published').order('created_at',{ascending:false}),
      supabaseClient.from('notices').select('*').eq('is_active',true).order('is_pinned',{ascending:false}).order('created_at',{ascending:false})
    ]);
    if(Array.isArray(dR.data))state.deposits=dR.data.map(d=>({...d,transactionId:d.transaction_id,date:d.created_at}));
    if(Array.isArray(wR.data))state.withdrawals=wR.data.map(w=>({...w,number:w.account,date:w.created_at}));
    state.walletHistory=[
      ...state.deposits.map(d=>({id:'deposit-'+d.id,type:'deposit',title:`Deposit — ${String(d.status||'pending')}`,amount:Number(d.status||'').toLowerCase()==='approved'?Number(d.amount)||0:0,status:String(d.status||'pending'),date:d.date||d.created_at||''})),
      ...state.withdrawals.map(w=>({id:'withdraw-'+w.id,type:'withdrawal',title:`Withdrawal — ${String(w.status||'pending')}`,amount:Number(w.amount)||0,status:String(w.status||'pending'),date:w.date||w.created_at||''}))
    ].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
    persist();
    renderIncome();
  }catch(e){console.warn('Balance refresh:',e.message||e)}
}

async function supabaseRequest(table, options={}){
  if(!supabaseClient) throw new Error('Supabase is not configured.');
  let url = supabaseClient.url + '/rest/v1/' + table;
  if(options.query) url += '?' + options.query;
  const response = await fetch(url, {
    method: options.method || 'GET',
    headers: {
      apikey: supabaseClient.key,
      Authorization: 'Bearer ' + supabaseClient.key,
      'Content-Type': 'application/json',
      Prefer: options.prefer || 'return=representation'
    },
    body: options.body ? JSON.stringify(options.body) : undefined
  });
  if(!response.ok) throw new Error(await response.text());
  const text = await response.text();
  return text ? JSON.parse(text) : null;
}

function loadMedia(event){
  const file = event.target.files?.[0];
  if(!file) return;
  if(!file.type.startsWith('video/') && !file.type.startsWith('image/')){
    toast('Video অথবা Image নির্বাচন করুন।'); return;
  }
  if(state.mediaUrl) URL.revokeObjectURL(state.mediaUrl);
  state.mediaUrl = URL.createObjectURL(file);
  state.mediaName = file.name;
  state.mediaType = file.type.startsWith('video/') ? 'video' : 'image';
  buildPreview();

  const ready = ()=>{
    const duration = state.mediaType==='video' ? Number(video.duration)||0 : 5;
    state.duration = duration;
    if(state.trimEnd===0 || state.trimEnd>duration) state.trimEnd=duration;
    state.effectEnd = duration;
    state.animationEnd = duration;
    if(video) video.playbackRate=Number(state.playbackRate)||1;
    syncTimelineUI(duration);
    applyEffectVisual();
    startRenderLoop();
  };

  if(state.mediaType==='video'){
    video.onloadedmetadata = ready;
    video.ontimeupdate = ()=>{
      const t=video.currentTime||0;
      $('currentTime').textContent=formatTime(t);
      $('seekBar').value=t;
      updateTimelinePro();
      checkBeatPulse(t);
      applyEffectVisual();
      syncAudioToVideo(false);
      if(state.trimEnd>state.trimStart && t>=state.trimEnd){
        video.currentTime=state.trimStart; video.pause();
      }
    };
    video.onplay=()=>{
      $('playButton').textContent='⏸️';
      startAnimation();
      syncAudioToVideo(true);
      startRenderLoop();
    };
    video.onpause=()=>{
      $('playButton').textContent='▶️';
      stopAnimation();
      syncAudioToVideo(false);
    };
  }else{
    video.onload = ready;
  }
  persist();
  toast('🎬 Media loaded successfully');
}

function syncTimelineUI(duration){
  const d=Number(duration)||0;
  $('durationTime').textContent=formatTime(d);
  $('seekBar').max=d; $('seekBar').value=state.mediaType==='video' ? (video?.currentTime||0) : 0;
  $('trimStart').max=d; $('trimEnd').max=d;
  $('trimStart').value=Math.min(state.trimStart,d);
  $('trimEnd').value=Math.min(state.trimEnd||d,d);
  $('startValue').textContent=formatTime(state.trimStart);
  $('endValue').textContent=formatTime(state.trimEnd||d);
  if($('effectStart')){$('effectStart').max=d;$('effectStart').value=Math.min(state.effectStart,d);}
  if($('effectEnd')){$('effectEnd').max=d;$('effectEnd').value=Math.min(state.effectEnd||d,d);}
  if($('effectStartValue'))$('effectStartValue').textContent=formatTime(state.effectStart);

function renderFrame(){
  if(!video) return;
  const active = state.effect==='none' || state.mediaType!=='video' ||
    ((video.currentTime||0)>=state.effectStart && (video.currentTime||0)<=state.effectEnd);
  const k = active ? state.effectIntensity/100 : 0;
  const b=100+(state.brightness-100)*k;
  const c=100+(state.contrast-100)*k;
  const s=100+(state.saturate-100)*k;
  const g=state.grayscale*k;
  const bl=state.blur*k;
  video.style.filter=`brightness(${b}%) contrast(${c}%) saturate(${s}%) grayscale(${g}%) blur(${bl}px)`;
  video.style.opacity=state.opacity/100;
  video.style.transform=`translate(${state.panX||0}%,${state.panY||0}%) rotate(${state.rotation}deg) scaleX(${state.flipX}) scale(${state.zoom/100})`;
  applyEffectVisual();
}

/* ===================== MESSAGES ===================== */
async function loadUserMessages(){
  const box=$('userMessageList');if(!box||!supabaseClient)return;
  const {data:{user}}=await getSupabaseAuth().getUser();if(!user)return;
  box.innerHTML='<div class="loading">Loading messages...</div>';
  const {data,error}=await supabaseClient.from('messages').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
  if(error){box.innerHTML=`<div class="empty">${escapeHTML(error.message||'Messages load failed')}</div>`;return;}
  state.messages=Array.isArray(data)?data:[];persist();
  if(!state.messages.length){box.innerHTML='<div class="empty">কোনো message নেই।</div>';return;}
  box.innerHTML=state.messages.map(m=>`<div class="history"><b>${escapeHTML(m.message||m.content||m.text||'Message')}</b><div class="notice">Status: ${escapeHTML(String(m.status||'pending'))}</div>${m.admin_reply?`<div class="detail"><small>Admin Reply</small>${escapeHTML(m.admin_reply)}</div>`:''}<small>${escapeHTML(m.created_at||'')}</small></div>`).join('');
}
function saveMessageUserId(){ toast('Login করা User ID স্বয়ংক্রিয়ভাবে ব্যবহার হচ্ছে।');loadUserMessages(); }
async function sendUserMessage(){
  if(!supabaseClient){toast('Supabase connection নেই।');return;}
  const {data:{user}}=await getSupabaseAuth().getUser();if(!user){showAuth();return;}
  const text=$('userMessageText')?.value.trim();if(!text){toast('Message লিখুন।');return;}
  const {data,error}=await supabaseClient.from('messages').insert({user_id:user.id,message:text,status:'pending'}).select('*').single();
  if(error){toast(error.message||'Message send failed');return;}
  $('userMessageText').value='';state.messages=state.messages||[];state.messages.unshift(data);persist();renderUserMessages();toast('📤 Admin-কে Message পাঠানো হয়েছে');
}
function renderUserMessages(){loadUserMessages();}

/* PIXORA FINAL LIVE SYNC — keeps Admin→User data independent */
async function pixoraFinalLiveSync(){
  if(!supabaseClient) return;
  try{
    const {data:{user}}=await getSupabaseAuth().getUser();
    if(!user) return;

    const results=await Promise.allSettled([
      supabaseClient.from('notices').select('*').eq('is_active',true).order('is_pinned',{ascending:false}).order('created_at',{ascending:false}),
      supabaseClient.from('tasks').select('*').eq('status','published').order('created_at',{ascending:false}),
      supabaseClient.from('users').select('balance,name,phone').eq('auth_id',user.id).maybeSingle(),
      supabaseClient.from('deposits').select('*').eq('user_id',user.id).order('created_at',{ascending:false}),
      supabaseClient.from('withdrawals').select('*').eq('user_id',user.id).order('created_at',{ascending:false})
    ]);

    const notices=results[0].status==='fulfilled'?results[0].value:null;
    const tasks=results[1].status==='fulfilled'?results[1].value:null;
    const profile=results[2].status==='fulfilled'?results[2].value:null;
    const deposits=results[3].status==='fulfilled'?results[3].value:null;
    const withdrawals=results[4].status==='fulfilled'?results[4].value:null;

    if(notices && !notices.error && Array.isArray(notices.data)) renderUserNotices(notices.data);
    if(tasks && !tasks.error && Array.isArray(tasks.data)){
      state.tasks=tasks.data.map(t=>({...t,reward:Number(t.reward||0),createdAt:t.created_at}));
      renderTasks();
    }
    if(profile && !profile.error && profile.data){
      state.balance=Number(profile.data.balance||0);
      state.profile={...state.profile,name:profile.data.name||state.profile.name||'',phone:profile.data.phone||state.profile.phone||''};
      persist();
      renderIncome();
    }
    if(deposits && !deposits.error && Array.isArray(deposits.data)) state.deposits=deposits.data.map(d=>({...d,transactionId:d.transaction_id,date:d.created_at}));
    if(withdrawals && !withdrawals.error && Array.isArray(withdrawals.data)) state.withdrawals=withdrawals.data.map(w=>({...w,number:w.account,date:w.created_at}));
    state.walletHistory=[
      ...state.deposits.map(d=>({id:'deposit-'+d.id,type:'deposit',title:`Deposit — ${String(d.status||'pending')}`,amount:String(d.status||'').toLowerCase()==='approved'?Number(d.amount)||0:0,status:String(d.status||'pending'),date:d.date||d.created_at||''})),
      ...state.withdrawals.map(w=>({id:'withdraw-'+w.id,type:'withdrawal',title:`Withdrawal — ${String(w.status||'pending')}`,amount:Number(w.amount)||0,status:String(w.status||'pending'),date:w.date||w.created_at||''}))
    ].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
    persist();
    renderIncome();
  }catch(e){ console.warn('Pixora final live sync:',e); }
}

function startPixoraFinalLiveSync(){
  if(window.__pixoraFinalSyncStarted) return;
  window.__pixoraFinalSyncStarted=true;
  const run=()=>{if(document.visibilityState!=='hidden') pixoraFinalLiveSync();};
  setTimeout(run,500);
  setInterval(run,5000);
  window.addEventListener('focus',run);
  document.addEventListener('visibilitychange',run);
}

async function sharePixora(){
  if(!supabaseClient){toast('Supabase connection নেই।');return;}
  const {data:{user}}=await getSupabaseAuth().getUser();
  if(!user){showAuth();return;}

  // Avoid navigator.share() because some Android WebViews can crash with "Aw, Snap!".
  // Use a normal web-safe share chooser instead.
  const url=location.href;
  const text='Pixora Editor & Earning App';
  const old=document.getElementById('pixoraShareChooser');
  if(old) old.remove();

  const box=document.createElement('div');
  box.id='pixoraShareChooser';
  box.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:99999;display:flex;align-items:center;justify-content:center;padding:18px';
  box.innerHTML=`<div style="width:min(420px,100%);background:#111827;color:#fff;border:1px solid #334155;border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.45)">
    <h3 style="margin:0 0 8px">📤 Share Pixora</h3>
    <p style="color:#cbd5e1;margin:0 0 16px">একটি অপশন দিয়ে Pixora শেয়ার করুন।</p>
    <div style="display:grid;gap:10px">
      <button id="pixShareWA" class="primary">📱 WhatsApp</button>
      <button id="pixShareTG" class="primary">✈️ Telegram</button>
      <button id="pixShareCopy" class="primary">🔗 Copy Link</button>
      <button id="pixShareClose" style="background:#374151;color:#fff;border:0;padding:12px;border-radius:10px">বন্ধ করুন</button>
    </div>
  </div>`;
  document.body.appendChild(box);

  const recordReward=async()=>{
    const marker='[PIXORA_SHARE_REWARD_5]';
    const {data:existing,error:checkError}=await supabaseClient.from('messages').select('id,status').eq('user_id',user.id).eq('message',marker).maybeSingle();
    if(checkError) throw checkError;
    if(!existing){
      const {error}=await supabaseClient.from('messages').insert({user_id:user.id,message:marker,status:'pending'});
      if(error) throw error;
      const el=document.getElementById('shareStatus');if(el)el.textContent='✅ Share recorded. ৳5 reward is pending Admin approval.';
      toast('📤 Share recorded — ৳5 pending Admin approval');
      await loadUserMessages();
    }else toast('এই User-এর Share reward request আগে দেওয়া হয়েছে।');
  };

  document.getElementById('pixShareWA').onclick=async()=>{
    window.open('https://wa.me/?text='+encodeURIComponent(text+'\n'+url),'_blank','noopener,noreferrer');
    try{await recordReward();}catch(e){toast(e.message||'Share request save হয়নি');}
    box.remove();
  };
  document.getElementById('pixShareTG').onclick=async()=>{
    window.open('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(text),'_blank','noopener,noreferrer');
    try{await recordReward();}catch(e){toast(e.message||'Share request save হয়নি');}
    box.remove();
  };
  document.getElementById('pixShareCopy').onclick=async()=>{
    try{
      const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');ta.remove();
      toast('🔗 Pixora link copied');
    }catch(e){toast('Link copy করা যায়নি।');}
    try{await recordReward();}catch(e){toast(e.message||'Share request save হয়নি');}
    box.remove();
  };
  document.getElementById('pixShareClose').onclick=()=>box.remove();
  box.addEventListener('click',e=>{if(e.target===box)box.remove();});
}
</script>
