<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixora Live Control Panel & App</title>

<!-- Firebase SDK Libraries -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
  :root { --bg: #0d1417; --card: #151e21; --border: #263236; --accent: #47dca3; --text: #edf3f1; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; margin: 0; }
  .container { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media(max-width: 768px){ .container { grid-template-columns: 1fr; } }
  .box { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; }
  h2, h3 { color: #fff; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  label { display: block; font-size: 12px; color: #8b9d9e; margin-top: 12px; }
  input { width: 100%; padding: 10px; background: #10181b; border: 1px solid var(--border); border-radius: 6px; color: #fff; margin-top: 5px; box-sizing: border-box; }
  button { width: 100%; margin-top: 15px; padding: 12px; background: var(--accent); color: #08281e; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
  button:hover { opacity: 0.9; }
  .status-badge { background: rgba(71,220,163,0.1); color: var(--accent); padding: 5px 10px; border-radius: 20px; font-size: 12px; display: inline-block; margin-bottom: 15px; }
  .live-value { font-weight: bold; color: var(--accent); font-size: 18px; }
</style>
</head>
<body>

<div class="container">

  <!-- =================   ================= -->
  <div class="box">
    <h2> </h2>
    <div class="status-badge">   </div>
    
    <label>   (BDT)</label>
    <input type="number" id="adminRate" step="0.01" placeholder=": 0.10">

    <label>  </label>
    <input type="number" id="adminLimit" placeholder=": 20">

    <button onclick="saveAdminData()">  </button>
  </div>

  <!-- =================    ================= -->
  <div class="box">
    <h2>  ()</h2>
    <div class="status-badge" style="color: #60a5fa; background: rgba(96,165,250,0.1);">    </div>

    <p>   : <span id="userRateDisplay" class="live-value"> 0.00</span></p>
    <p>  : <span id="userLimitDisplay" class="live-value">0 </span></p>
    <p style="font-size: 12px; color: #8b9d9e; margin-top: 20px;">           -    </p>
  </div>

</div>

<script>
// .  Firebase    
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

// .  
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

// .      
function saveAdminData() {
  const rateVal = parseFloat(document.getElementById('adminRate').value);
  const limitVal = parseInt(document.getElementById('adminLimit').value);

  if (isNaN(rateVal) || isNaN(limitVal)) {
    alert("       !");
    return;
  }

  //    
  db.ref('app_settings/ads').set({
    rate: rateVal,
    limit: limitVal,
    updatedAt: Date.now()
  }).then(() => {
    alert("         !");
  }).catch((error) => {
    alert("   ! : " + error.message);
  });
}

// .       (Realtime Listener)
db.ref('app_settings/ads').on('value', (snapshot) => {
  const data = snapshot.val();
  
  if (data) {
    //    
    document.getElementById('userRateDisplay').innerText = ' ' + (data.rate || 0);
    document.getElementById('userLimitDisplay').innerText = (data.limit || 0) + ' ';
    
    //     
    document.getElementById('adminRate').value = data.rate || '';
    document.getElementById('adminLimit').value = data.limit || '';
  }
}, (error) => {
  console.error("   :", error);
});
</script>

</body>
</html>
